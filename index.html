<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lantern Inn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--night:#1a1330;--deep:#120d22;--lamp:#f4b94a;--moss:#6cb58a;--wine:#d4435b;--paper:#f1e7d0;--dim:#9a8fb5;--line:#3a2f5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--deep);color:var(--paper);font:700 16px/1.4 Nunito,system-ui,sans-serif;overflow:hidden;touch-action:none}
h1,h2{font-family:'Bagel Fat One',Nunito,sans-serif;font-weight:400;margin:0}
button{font:inherit;color:var(--night);background:var(--lamp);border:0;border-radius:14px;padding:.7em 1.1em;cursor:pointer;font-weight:800}
button:focus-visible,input:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
button.ghost{background:transparent;color:var(--paper);border:2px solid var(--line)}
button:disabled{opacity:.35;cursor:default}
input{font:inherit;background:var(--night);color:var(--paper);border:2px solid var(--line);border-radius:12px;padding:.65em .9em;width:100%}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
.screen.on{display:flex}
.card{background:var(--night);border:2px solid var(--line);border-radius:22px;padding:24px;width:min(440px,100%)}
.stack{display:grid;gap:12px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
#menu h1{font-size:clamp(44px,9vw,68px);color:var(--lamp);line-height:.95;text-shadow:4px 4px 0 var(--wine)}
.sub{color:var(--dim);margin:6px 0 18px}
.coins{color:var(--lamp)}
#err{color:var(--wine);min-height:1.4em}
#codeBig{font-family:'Bagel Fat One';font-size:56px;letter-spacing:.12em;color:var(--lamp)}
#roster{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--deep);border:2px solid var(--line);border-radius:999px;padding:.3em .8em}
/* game */
#game{position:fixed;inset:0;display:none}#game.on{display:block}
canvas{position:absolute;inset:0;width:100%;height:100%}
#tiles{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;overflow-x:auto;pointer-events:none;z-index:5}
.tile{position:relative;flex:0 0 auto;width:92px;height:70px;border-radius:12px;overflow:hidden;background:var(--night);border:2px solid var(--line)}
.tile video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.tile b{position:absolute;left:0;right:0;bottom:0;font-size:11px;padding:1px 6px;background:#0009;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.dead video{filter:grayscale(1) brightness(.5)}
.tile.dead::after{content:'🔇';position:absolute;top:2px;right:4px;font-size:14px}
body.meeting .tile{width:150px;height:112px}
#bar{position:absolute;left:50%;top:92px;transform:translateX(-50%);width:min(320px,70vw);height:16px;border-radius:99px;background:var(--night);border:2px solid var(--line);overflow:hidden;z-index:4}
#bar i{display:block;height:100%;width:0;background:var(--moss);transition:width .3s}
#hud{position:absolute;top:116px;left:0;right:0;text-align:center;z-index:4;text-shadow:0 2px 6px #000}
#role{font-family:'Bagel Fat One';font-size:20px}
#actions{position:absolute;right:14px;bottom:18px;display:grid;gap:10px;z-index:6}
#actions button{width:92px;height:92px;border-radius:50%;font-size:15px;line-height:1.15}
#kill{background:var(--wine);color:#fff}#use{background:var(--moss)}
#stick{position:absolute;left:14px;bottom:18px;width:140px;height:140px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff30;z-index:6;display:none}
#knob{position:absolute;left:50px;top:50px;width:40px;height:40px;border-radius:50%;background:#ffffff70}
@media (pointer:coarse){#stick{display:block}}
#meeting{position:absolute;inset:0;background:#120d22ee;display:none;z-index:8;padding:130px 14px 14px;overflow:auto}
#meeting.on{display:block}
.mwrap{max-width:560px;margin:0 auto}
#votes{display:grid;gap:8px;margin:14px 0}
.vrow{display:flex;gap:10px;align-items:center;background:var(--night);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.vrow.dead{opacity:.4}.vrow span:nth-child(2){flex:1}
.vrow button{padding:.4em .9em}
#banner{position:absolute;inset:0;display:none;z-index:9;align-items:center;justify-content:center;text-align:center;background:#120d22f2;padding:20px}
#banner.on{display:flex}
#banner h2{font-size:clamp(34px,8vw,60px);color:var(--lamp)}
/* shop */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.item{background:var(--deep);border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;font-size:13px}
.item.eq{border-color:var(--lamp)}
.item .ico{font-size:28px;height:36px;line-height:36px}.sw{width:30px;height:30px;border-radius:50%;margin:3px auto;border:2px solid #0006}
#shop .card{width:min(560px,100%)}
</style>
</head>
<body>

<div id="menu" class="screen on">
  <div class="card stack">
    <div><h1>Lantern<br>Inn</h1><p class="sub">Fix up the inn. Find the gremlins. Everyone's on camera.</p></div>
    <input id="name" maxlength="12" placeholder="Your name" autocomplete="off">
    <button id="create">Host a room</button>
    <div class="row"><input id="code" maxlength="4" placeholder="Room code" style="text-transform:uppercase"><button id="join">Join</button></div>
    <div class="row"><button class="ghost" id="openShop">Shop</button><div class="coins" style="text-align:right">🏮 <span id="coinTxt">0</span> lanterns</div></div>
    <div id="err" role="alert"></div>
  </div>
</div>

<div id="shop" class="screen">
  <div class="card stack">
    <div class="row"><h2>Dress-up shop</h2><div class="coins" style="text-align:right">🏮 <span id="coinTxt2">0</span></div></div>
    <canvas id="preview" width="120" height="130" style="position:static;width:120px;height:130px;margin:0 auto"></canvas>
    <div><b>Colors</b><div class="grid" id="colors"></div></div>
    <div><b>Hats</b><div class="grid" id="hats"></div></div>
    <button id="closeShop">Back</button>
  </div>
</div>

<div id="lobby" class="screen">
  <div class="card stack" style="text-align:center">
    <div>Room code</div><div id="codeBig"></div>
    <div id="roster"></div>
    <p class="sub" id="lobbyHint">Share the code. 3–10 players.</p>
    <button id="start">Start game</button>
    <button class="ghost" id="shopFromLobby">Change look</button>
    <div id="err2" role="alert" style="color:var(--wine)"></div>
  </div>
</div>

<div id="game">
  <canvas id="cv"></canvas>
  <div id="tiles"></div>
  <div id="bar"><i></i></div>
  <div id="hud"><div id="role"></div><div id="hint"></div></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="actions">
    <button id="use">Fix</button>
    <button id="kill">Gremlin<br>strike</button>
    <button id="call">Ring bell</button>
  </div>
  <div id="meeting"><div class="mwrap">
    <h2>Meeting</h2><div id="mtimer" class="sub"></div>
    <div id="votes"></div>
    <button class="ghost" id="skip">Skip vote</button>
  </div></div>
  <div id="banner"><div><h2 id="bt"></h2><p id="bs" style="font-size:20px"></p></div></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
/* ---------- data & shop ---------- */
const COLORS=[['Brick','#e07a5f',0],['Moss','#6cb58a',0],['Sky','#6ea8d8',0],['Plum','#9d6bb5',0],['Butter','#f2d16b',25],['Rose','#f08cae',25],['Ink','#34304f',40],['Mint','#8fe0c4',40],['Flame','#ff5a1f',60],['Gold','#d9a520',90]];
const HATS=[['None','',0],['Bow','🎀',25],['Cap','🧢',30],['Top hat','🎩',45],['Cowboy','🤠',50],['Phones','🎧',60],['Shroom','🍄',70],['Crown','👑',120],['Wizard','🧙',150],['Halo','😇',200]];
const SAVE_KEY='lanternInn.v1';
let save=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')||{coins:30,name:'',owned:['c:#e07a5f','c:#6cb58a','c:#6ea8d8','c:#9d6bb5','h:'],color:'#e07a5f',hat:''};
const persist=()=>localStorage.setItem(SAVE_KEY,JSON.stringify(save));
const $=id=>document.getElementById(id);
function refreshCoins(){$('coinTxt').textContent=$('coinTxt2').textContent=save.coins}
function drawBean(g,x,y,color,hat,alpha=1,s=1,face=1){
  g.save();g.globalAlpha=alpha;g.translate(x,y);g.scale(s,s);
  g.fillStyle='#0004';g.beginPath();g.ellipse(0,26,22,7,0,0,7);g.fill();
  g.fillStyle=color;g.strokeStyle='#0008';g.lineWidth=3;
  g.beginPath();g.roundRect(-20,-28,40,54,18);g.fill();g.stroke();
  g.fillStyle='#dff3ff';g.beginPath();g.roundRect(face*4-2,-18,18*face>0?18:-18,13,6);g.fill();g.stroke();
  if(hat){g.font='28px serif';g.textAlign='center';g.fillText(hat,0,-26)}
  g.restore();
}
function renderShop(){
  const mk=(list,pre,cur,el,sw)=>{el.innerHTML='';list.forEach(([n,v,p])=>{
    const key=pre+':'+v,own=save.owned.includes(key),d=document.createElement('div');
    d.className='item'+(save[pre==='c'?'color':'hat']===v?' eq':'');
    d.innerHTML=(sw?`<div class="sw" style="background:${v}"></div>`:`<div class="ico">${v||'∅'}</div>`)+n+'<br>'+(own?'Owned':'🏮 '+p);
    d.onclick=()=>{
      if(!own){if(save.coins<p)return;save.coins-=p;save.owned.push(key)}
      save[pre==='c'?'color':'hat']=v;persist();renderShop();refreshCoins();
    };el.appendChild(d)})};
  mk(COLORS,'c',save.color,$('colors'),true);mk(HATS,'h',save.hat,$('hats'),false);
  const g=$('preview').getContext('2d');g.clearRect(0,0,120,130);drawBean(g,60,75,save.color,save.hat,1,1.2);
}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$('game').classList.remove('on');
  if(id==='game')$('game').classList.add('on');else if(id)$(id).classList.add('on')}
let shopBack='menu';
$('openShop').onclick=()=>{shopBack='menu';renderShop();show('shop')};
$('shopFromLobby').onclick=()=>{shopBack='lobby';renderShop();show('shop')};
$('closeShop').onclick=()=>{socket.connected&&room&&socket.emit('appearance',{color:save.color,hat:save.hat});show(shopBack)};
$('name').value=save.name;refreshCoins();

/* ---------- networking & media ---------- */
const socket=io();
let myId=null,room=null,S=null,you=null,localStream=null;
const peers={},tiles={};
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};

async function getMedia(){
  if(localStream)return;
  try{localStream=await navigator.mediaDevices.getUserMedia({video:{width:320,height:240,facingMode:'user'},audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){try{localStream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(_){localStream=null}}
}
function tile(id,name){
  if(!tiles[id]){
    const d=document.createElement('div');d.className='tile';
    const v=document.createElement('video');v.autoplay=true;v.playsInline=true;if(id===myId)v.muted=true;
    const b=document.createElement('b');d.append(v,b);$('tiles').appendChild(d);tiles[id]={d,v,b};
  }
  if(name)tiles[id].b.textContent=name;
  return tiles[id];
}
function mkPeer(id,initiator){
  const pc=new RTCPeerConnection(ICE);peers[id]={pc,q:Promise.resolve()};
  pc.onicecandidate=e=>e.candidate&&socket.emit('signal',{to:id,data:{c:e.candidate}});
  pc.ontrack=e=>{const t=tile(id);t.v.srcObject=e.streams[0];t.v.play().catch(()=>{})};
  if(initiator)pc.onnegotiationneeded=async()=>{await pc.setLocalDescription(await pc.createOffer());socket.emit('signal',{to:id,data:{d:pc.localDescription}})};
  if(localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  else if(initiator){pc.addTransceiver('audio',{direction:'recvonly'});pc.addTransceiver('video',{direction:'recvonly'})}
  return pc;
}
socket.on('signal',({from,data})=>{
  const pr=peers[from]||(mkPeer(from,false),peers[from]);
  pr.q=pr.q.then(async()=>{
    const pc=pr.pc;
    if(data.d){await pc.setRemoteDescription(data.d);
      if(data.d.type==='offer'){await pc.setLocalDescription(await pc.createAnswer());socket.emit('signal',{to:from,data:{d:pc.localDescription}})}}
    else if(data.c){try{await pc.addIceCandidate(data.c)}catch(e){}}
  }).catch(console.warn);
});
socket.on('left',id=>{peers[id]?.pc.close();delete peers[id];tiles[id]?.d.remove();delete tiles[id]});

/* THE RULE: dead players' mics are cut (sender side + every listener's side) */
function applyMute(){
  if(!S)return;
  const myP=S.players.find(p=>p.id===myId);
  if(localStream&&myP)localStream.getAudioTracks().forEach(t=>t.enabled=myP.alive);
  S.players.forEach(p=>{const t=tile(p.id,p.name);t.d.classList.toggle('dead',!p.alive);if(p.id!==myId)t.v.muted=!p.alive});
}

async function enter(kind){
  $('err').textContent='';
  const name=$('name').value.trim()||'Guest';save.name=name;persist();
  await getMedia();
  const info={name,color:save.color,hat:save.hat};
  if(kind==='create')socket.emit('create',info);
  else socket.emit('join',{code:$('code').value,info});
}
$('create').onclick=()=>enter('create');
$('join').onclick=()=>{if($('code').value.length!==4){$('err').textContent='Enter the 4-letter room code.';return}enter('join')};
socket.on('err',m=>{$('err').textContent=m;$('err2').textContent=m});
socket.on('joined',async({code,id,peers:list})=>{
  myId=id;room=code;$('codeBig').textContent=code;
  const me=tile(id,save.name);if(localStream)me.v.srcObject=localStream;
  list.forEach(pid=>mkPeer(pid,true));
  show('lobby');
});
$('start').onclick=()=>socket.emit('start');

/* ---------- state ---------- */
let phase='lobby';const keys={};let lastBanner=0;
socket.on('state',s=>{
  S=s;
  if(s.phase!==phase){phase=s.phase}
  if(!room)return;
  applyMute();
  if(phase==='lobby'){
    $('roster').innerHTML=s.players.map(p=>`<span class="chip">${p.name}${p.id===s.host?' ★':''}</span>`).join('');
    $('start').style.display=s.host===myId?'':'none';
    $('lobbyHint').textContent=s.host===myId?'Share the code. 3–10 players.':'Waiting for the host to start…';
    if(!$('game').classList.contains('on')&&!$('shop').classList.contains('on'))show('lobby');
  }
  $('bar').firstElementChild.style.width=(s.progress.total?s.progress.done/s.progress.total*100:0)+'%';
  if(phase==='meeting')renderVotes();
});
socket.on('you',y=>{you=y;const g=y.role==='gremlin';
  $('role').textContent=g?'You are a Gremlin 😈':'You are a Guest 🏮';$('role').style.color=g?'var(--wine)':'var(--moss)';
  $('kill').style.display=g?'':'none';$('use').style.display=g?'none':'';
  show('game');document.body.classList.remove('meeting');
  const w=S&&S.players.find(p=>p.id===myId);if(!w||w.alive)banner(g?'Gremlin':'Guest',g?'Take them out quietly.':'Finish your chores. Watch faces.',2200);
});
function banner(t,s,ms){$('bt').textContent=t;$('bs').textContent=s;$('banner').classList.add('on');clearTimeout(lastBanner);if(ms)lastBanner=setTimeout(()=>$('banner').classList.remove('on'),ms)}
socket.on('meeting',()=>{document.body.classList.add('meeting');$('meeting').classList.add('on');myVote=null;$('banner').classList.remove('on')});
let myVote=null;
function renderVotes(){
  const me=S.players.find(p=>p.id===myId),can=me&&me.alive&&!myVote;
  $('votes').innerHTML='';
  S.players.forEach(p=>{
    const r=document.createElement('div');r.className='vrow'+(p.alive?'':' dead');
    r.innerHTML=`<span>${p.alive?'':'💀'}</span><span>${p.name}${p.id===myId?' (you)':''}</span><span>${S.voted.includes(p.id)?'✔ voted':''}</span>`;
    if(p.alive){const b=document.createElement('button');b.textContent='Vote';b.disabled=!can;b.onclick=()=>{myVote=p.id;socket.emit('vote',p.id)};r.appendChild(b)}
    $('votes').appendChild(r)});
  $('skip').disabled=!can;
  $('mtimer').textContent=me&&me.alive?(myVote?'Vote locked in.':'Talk it out, then vote.')+' '+Math.max(0,Math.ceil((S.meetingEnds-Date.now())/1000))+'s':'You are out. Your mic is off, but you can watch.';
}
$('skip').onclick=()=>{myVote='skip';socket.emit('vote','skip')};
socket.on('result',r=>{
  $('meeting').classList.remove('on');document.body.classList.remove('meeting');
  banner(r.ejected?r.ejected.name+' was sent out':(r.tie?'Tie vote':'No one was sent out'),r.ejected?(r.ejected.role==='gremlin'?'They were a Gremlin! 😈':'They were a Guest… 🏮'):'',5600);
});
socket.on('over',({winner,roles,tasks})=>{
  const g=roles[myId]==='gremlin',won=(winner==='gremlins')===g;
  let earn=10+(tasks[myId]||0)*8+(won?40:0);save.coins+=earn;persist();refreshCoins();
  $('meeting').classList.remove('on');document.body.classList.remove('meeting');
  const names=S?S.players.filter(p=>roles[p.id]==='gremlin').map(p=>p.name).join(', '):'';
  banner(won?'You win!':'You lose',(winner==='gremlins'?'The Gremlins took over. ':'The inn is safe. ')+'Gremlins: '+names+'. +'+earn+' 🏮',9500);
});
socket.on('lobby',()=>{phase='lobby';you=null;$('banner').classList.remove('on');show('lobby')});

/* ---------- game loop ---------- */
const cv=$('cv'),g=cv.getContext('2d');let VW=0,VH=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR}
addEventListener('resize',resize);resize();
const W=1600,H=1000,BELL={x:800,y:500};
let pos={x:800,y:500},face=1,doing=null,joy={x:0,y:0},lastSend=0,last=performance.now();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==='e')useAct();if(e.key==='q')killAct();if(e.key==='r')callAct();if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault()});
addEventListener('keyup',e=>delete keys[e.key.toLowerCase()]);
const stick=$('stick'),knob=$('knob');
function joyMove(t){const r=stick.getBoundingClientRect(),cx=r.left+70,cy=r.top+70;let dx=t.clientX-cx,dy=t.clientY-cy;const d=Math.hypot(dx,dy),m=60;if(d>m){dx*=m/d;dy*=m/d}joy={x:dx/m,y:dy/m};knob.style.left=50+dx+'px';knob.style.top=50+dy+'px'}
stick.addEventListener('touchstart',e=>{joyMove(e.touches[0]);e.preventDefault()},{passive:false});
stick.addEventListener('touchmove',e=>{joyMove(e.touches[0]);e.preventDefault()},{passive:false});
stick.addEventListener('touchend',()=>{joy={x:0,y:0};knob.style.left=knob.style.top='50px'});

const me=()=>S&&S.players.find(p=>p.id===myId);
const near=(a,b,r)=>Math.hypot(a.x-b.x,a.y-b.y)<r;
function nearTask(){return you&&you.tasks.find(t=>!t.done&&near(pos,t,110))}
function nearTarget(){if(!S)return null;return S.players.find(p=>p.id!==myId&&p.alive&&!(you.mates||[]).includes(p.id)&&near(pos,p,120))}
function nearBody(){return S&&S.bodies.find(b=>near(pos,b,130))}
function useAct(){const t=nearTask();if(t&&!doing&&me()?.alive&&phase==='play')doing={i:t.i,t0:performance.now()}}
function killAct(){const t=nearTarget();if(t&&you.role==='gremlin'&&Date.now()>=you.killReady)socket.emit('kill',t.id)}
function callAct(){socket.emit('call')}
$('use').onclick=useAct;$('kill').onclick=killAct;$('call').onclick=callAct;
socket.on('state',s=>{const m=s.players.find(p=>p.id===myId);if(m&&phase!=='play'&&phase!=='lobby'){}});
socket.on('meeting',()=>{doing=null});

function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!$('game').classList.contains('on')||!S){requestAnimationFrame(frame);return}
  const m=me(),canMove=phase==='play'&&!doing;
  if(phase==='play'&&m&&you&&joy.x===0&&joy.y===0){} 
  if(canMove){
    let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y;
    const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
    pos.x=Math.max(20,Math.min(W-20,pos.x+dx*230*dt));pos.y=Math.max(20,Math.min(H-20,pos.y+dy*230*dt));
    if(dx)face=dx>0?1:-1;
  }
  if(phase==='meeting'||phase==='result'){if(m){pos.x=m.x;pos.y=m.y}}
  if(doing){
    const t=you.tasks.find(t=>t.i===doing.i),el=now-doing.t0;
    if(!t||!near(pos,t,130)||phase!=='play')doing=null;
    else if(el>1600){socket.emit('task',doing.i);doing=null}
  }
  if(now-lastSend>50&&phase==='play'){socket.emit('move',pos);lastSend=now}
  // buttons
  const alive=m&&m.alive;
  $('use').disabled=!(alive&&phase==='play'&&nearTask());
  $('kill').disabled=!(alive&&phase==='play'&&you&&you.role==='gremlin'&&nearTarget()&&Date.now()>=you.killReady);
  const cd=you&&you.role==='gremlin'?Math.ceil((you.killReady-Date.now())/1000):0;
  $('kill').innerHTML=cd>0?'Wait<br>'+cd+'s':'Gremlin<br>strike';
  const canCall=alive&&phase==='play'&&(nearBody()||(near(pos,BELL,120)&&you&&you.bells>0));
  $('call').disabled=!canCall;$('call').innerHTML=nearBody()?'Report<br>body':'Ring<br>bell';
  $('hint').textContent=!alive&&phase==='play'?'You are out — mic off until next round. Spectate!':'';
  // draw
  const sc=Math.min(1.3,Math.max(.7,Math.min(VW,VH)/700));
  g.setTransform(DPR,0,0,DPR,0,0);g.fillStyle='#0d0a1a';g.fillRect(0,0,VW,VH);
  const cx=Math.max(VW/2/sc,Math.min(W-VW/2/sc,pos.x)),cy=Math.max(VH/2/sc,Math.min(H-VH/2/sc,pos.y));
  g.save();g.translate(VW/2,VH/2);g.scale(sc,sc);g.translate(-cx,-cy);
  // floor boards
  g.fillStyle='#2a2040';g.fillRect(0,0,W,H);
  g.strokeStyle='#33284f';g.lineWidth=2;for(let x=0;x<=W;x+=100){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}
  g.strokeStyle='#4a3a70';g.lineWidth=14;g.strokeRect(7,7,W-14,H-14);
  g.fillStyle='#3b2c58';g.beginPath();g.arc(BELL.x,BELL.y,150,0,7);g.fill();
  g.font='46px serif';g.textAlign='center';g.fillText('🔔',BELL.x,BELL.y+16);
  const ICONS=['🍲','🕯️','🧹','📦','🪟','🔑'];
  if(you)you.tasks.forEach(t=>{g.globalAlpha=t.done?.3:1;g.fillStyle=t.done?'#6cb58a':'#f4b94a';g.beginPath();g.roundRect(t.x-34,t.y-34,68,68,16);g.fill();g.globalAlpha=1;g.font='34px serif';g.fillText(t.done?'✅':ICONS[t.i],t.x,t.y+12)});
  S.bodies.forEach(b=>{g.fillStyle=b.color;g.beginPath();g.ellipse(b.x,b.y+8,24,14,0,0,7);g.fill();g.font='26px serif';g.fillText('💀',b.x,b.y-6)});
  const ghost=m&&!m.alive;
  S.players.forEach(p=>{
    if(!p.alive&&!ghost)return;
    const isMe=p.id===myId,px=isMe?pos.x:p.x,py=isMe?pos.y:p.y;
    drawBean(g,px,py,p.color,p.hat,p.alive?1:.45,1,isMe?face:1);
    g.fillStyle=you&&(you.mates||[]).includes(p.id)?'#ff6a85':'#f1e7d0';g.font='700 15px Nunito,sans-serif';g.fillText(p.name,px,py+46);
  });
  g.restore();
  if(doing){const el=Math.min(1,(now-doing.t0)/1600);g.fillStyle='#000a';g.fillRect(VW/2-70,VH/2+70,140,14);g.fillStyle='#f4b94a';g.fillRect(VW/2-68,VH/2+72,136*el,10)}
  if(phase==='meeting')renderVotes();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
